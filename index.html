        // Audio synthesizer using Web Audio API to pronounce letters/tones nicely
        function playTone(freq = 440, duration = 0.3) {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch(e) {
                console.log('Audio playback not supported:', e);
            }
        }

                                اللَّهُمَّ اهْدِنِي فِيمَنْ هَدَيْتَ وَعَافِنِي فِيمَنْ عَافَيْتَ وَتَوَلَّنِي فِيمَنْ تَوَلَّيْتَ وَبَارِكْ لِي فِيمَا أَعْطَيْتَ وَقِنِي شَرَّ مَا قَضَيْتَ إِنَّكَ تَقْضِي وَلَا يُقْضَى عَلَيْكَ وَإِنَّهُ لَا يَذِلُّ مَنْ وَالَيْتَ وَلَا يَعِزُّ مَنْ عَادَيْتَ تَبَارَكْتَ رَبَّنَا وَتَالَيْتَ نَسْتَغْفِرُكَ وَنَتُوبُ إِلَيْكَ اللَّهُمَّ اغْفِرْ لَنَا وَلِلْمُؤْمِنِينَ وَالْمُؤْمِنَاتِ وَالْمُسْلِمِينَ وَالْمُسْلِمَاتِ وَأَلِّفْ بَيْنَ قُلُوبِهِمْ وَأَصْلِحْ ذَاتَ بَيْنِهِمْ وَانْصُرْهُمْ عَلَى عَدُوِّكَ وَعَدُوِّهِمْ اللَّهُمَّ الْعَنِ الْكَفَرَةَ الَّذِينَ يَصُدُّونَ عَنْ سَبِيلِكَ وَيُكَذِّبُونَ رُسُلَكَ وَيُقَاتِلُونَ أَوْلِيَاءَكَ اللَّهُمَّ خَالِفْ بَيْنَ كالمَتِهِمْ وَزَلْزِلْ أَقْدَامَهُمْ وَأَنْزِلْ بِهِمْ بَأْسَكَ الَّذِي لَا تُرَدُّهُ عَنِ الْقَوْمِ الْمُجْرِمِينَ।
                            </div>
                        </div>

                        <!-- Bangla Translation -->
                        <div class="bg-white border border-slate-200 p-4 rounded-xl space-y-2 text-xs sm:text-sm text-slate-700 leading-relaxed shadow-sm">
                            <h4 class="font-bold text-emerald-900 text-sm">বাংলা অর্থ:</h4>
                            <p class="max-h-40 overflow-y-auto pr-2 text-justify">
                                হে আল্লাহ্! হেদায়েত কর আমায় যাহাদের তুমি হেদায়েত করিয়াছ তাহাদের সাথে। শান্তি স্বস্তিদান কর আমায় যাহাদের তুমি শান্তি স্বস্তিদান করিয়াছ তাহাদের সাথে। অভিভাবকত্ব গ্রহণ কর আমার যাহাদের তুমি অভিভাবকত্ব গ্রহণ করিয়াছ তাহাদের সাথে। বরকত দান কর আমায় যাহা তুমি দান করিয়াছ আমায় তাহাতে এবং রক্ষা কর আমায় উহার অনিষ্ট হইতে যাহা তুমি নির্ধারণ করিয়াছ। (আমার জন্য) কেননা তুমি নির্দেশ দান কর, তোমার উপর নির্দেশ দান করা চলে না। বস্তুতঃ সে ব্যক্তি অপমানিত হয় না যাহাকে তুমি মিত্র ভাবিয়াছ। আর সম্মানিত হয় না সেই ব্যক্তি যাহাকে তুমি শত্রু ভাবিয়াছ। বরকতময় তুমি হে আমাদের প্রতিপালক। আর তুমিই সুউচ্চ। আমরা তোমার নিকট ক্ষমা প্রার্থনা করি এবং তোমার দিকে রুজু হই। হে আল্লাহ্! ক্ষমা কর আমাদেরকে এবং মুমিন নর ও মুমিন নারীদেরকে আর মুসলমান নর ও মুসলমান নারীদেরকে তাহাদের অন্তরসমূহ জুড়িয়া দাও আর তাহাদের মাঝে মীমাংসা করিয়া দাও। সাহায্য কর তাহাদেরকে তোমার শত্রুও তাহাদের শত্রুর বিরুদ্ধে হে আল্লাহ লানত বর্ষণ কর কাফেরদের প্রতি যাহারা প্রতিবন্ধকতা সৃষ্টি করে তোমার পথে এবং অস্বীকার করে তোমার রাসুলদেরকে আর যুদ্ধবিগ্রহ করে তোমার অলীদের সাথে। হে আল্লাহ! বিভেদ সৃষ্টি করিয়া দাও তাহাদের কথার মাঝে এবং কম্পন সৃষ্টি করিয়া দাও তাহাদের পদযুগলে আর নাযিল কর তোমার এমন শাস্তি যাহা তুমি অপরাধীগণ হইতে অপসারণ কর না।
                            </p>
                        </div>

                        <div class="bg-amber-100/70 border border-amber-300 p-3 rounded-xl text-xs text-amber-950 font-semibold">
                            <strong>মাসআলা:</strong> মুসলমানদের উপর ব্যাপকভাবে কোন মুসীবত আসিলে ফজরের নামাজে দ্বিতীয় রাকাতে রুকুর পর দাঁড়ান অবস্থায় কুনূতে নাযিলাহ পাঠ করিতে হয়।
                        </div>
                    </div>
                `
            }
        ];

        function initApp() {
            populateSlideSelect();
            populateTocList();
            renderSlide();
            renderDocView();
            updateBookmarkBtn();
            lucide.createIcons();
            
            // Keyboard navigation
            document.addEventListener('keydown', (e) => {
                if (isDocView) return;
                if (e.key === 'ArrowRight' || e.key === 'Space') {
                    nextSlide();
                } else if (e.key === 'ArrowLeft') {
                    prevSlide();
                }
            });

            // Touch Swipe Support
            let touchstartX = 0;
            let touchendX = 0;
            const slideArea = document.getElementById('slideView');

            slideArea.addEventListener('touchstart', e => {
                touchstartX = e.changedTouches[0].screenX;
            }, false);

            slideArea.addEventListener('touchend', e => {
                touchendX = e.changedTouches[0].screenX;
                handleSwipe();
            }, false);

            function handleSwipe() {
                if (isDocView) return;
                if (touchendX < touchstartX - 50) nextSlide();
                if (touchendX > touchstartX + 50) prevSlide();
            }
        }

        function populateSlideSelect() {
            const select = document.getElementById('slideSelect');
            select.innerHTML = slidesData.map((s, idx) => `
                <option value="${idx}">${s.id}. ${s.title}</option>
            `).join('');
        }

        function populateTocList(filterQuery = '') {
            const list = document.getElementById('tocList');
            const filtered = slidesData.filter(s => 
                s.title.toLowerCase().includes(filterQuery.toLowerCase()) || 
                s.content.toLowerCase().includes(filterQuery.toLowerCase())
            );

            if (filtered.length === 0) {
                list.innerHTML = `<div class="text-center py-6 text-slate-400 text-xs">কোন বিষয়বস্তু খুঁজে পাওয়া যায় নাই</div>`;
                return;
            }

            list.innerHTML = filtered.map((s) => {
                const originalIndex = slidesData.findIndex(item => item.id === s.id);
                const isBookmarked = bookmarks.includes(s.id);
                return `
                    <button onclick="goToSlide(${originalIndex}); toggleTocModal();" class="w-full text-left p-3 rounded-xl hover:bg-emerald-50 border border-slate-100 hover:border-emerald-200 transition flex items-center justify-between group">
                        <div class="flex items-center space-x-3">
                            <span class="w-7 h-7 rounded-lg bg-emerald-100 group-hover:bg-emerald-800 text-emerald-900 group-hover:text-amber-300 flex items-center justify-center font-bold text-xs transition">
                                ${s.id}
                            </span>
                            <span class="text-sm font-semibold text-slate-800 group-hover:text-emerald-900">
                                ${s.title}
                            </span>
                        </div>
                        <div class="flex items-center space-x-2">
                            ${isBookmarked ? `<i data-lucide="bookmark" class="w-4 h-4 text-amber-500 fill-amber-500"></i>` : ''}
                            <i data-lucide="chevron-right" class="w-4 h-4 text-slate-400 group-hover:text-emerald-700"></i>
                        </div>
                    </button>
                `;
            }).join('');
            lucide.createIcons();
        }

        function filterToc(query) {
            populateTocList(query);
        }

        function renderSlide() {
            const slide = slidesData[currentSlide];
            const container = document.getElementById('slideContainer');
            
            container.innerHTML = slide.content;

            // Update Slide Indicator & Controls
            document.getElementById('slideIndicator').innerText = `${currentSlide + 1} / ${slidesData.length}`;
            document.getElementById('slideSelect').value = currentSlide;
            
            document.getElementById('prevBtn').disabled = (currentSlide === 0);
            document.getElementById('nextBtn').disabled = (currentSlide === slidesData.length - 1);

            // Update Progress Bar
            const progressPct = ((currentSlide + 1) / slidesData.length) * 100;
            document.getElementById('progressBar').style.width = `${progressPct}%`;

            updateBookmarkBtn();
            lucide.createIcons();
        }

        function renderDocView() {
            const docContainer = document.getElementById('docContainer');
            docContainer.innerHTML = slidesData.map(s => `
                <section class="border-b border-slate-200 pb-8 last:border-0">
                    <div class="flex items-center space-x-2 text-emerald-800 font-bold mb-3">
                        <span class="bg-emerald-100 px-2.5 py-1 rounded-lg text-xs">বিষয় #${s.id}</span>
                        <h3 class="text-lg font-bold">${s.title}</h3>
                    </div>
                    <div>${s.content}</div>
                </section>
            `).join('');
        }

        function toggleBookmark() {
            const slideId = slidesData[currentSlide].id;
            const idx = bookmarks.indexOf(slideId);
            if (idx > -1) {
                bookmarks.splice(idx, 1);
            } else {
                bookmarks.push(slideId);
            }
            localStorage.setItem('talimul_quran_bookmarks', JSON.stringify(bookmarks));
            updateBookmarkBtn();
            populateTocList();
        }

        function updateBookmarkBtn() {
            const slideId = slidesData[currentSlide].id;
            const isBookmarked = bookmarks.includes(slideId);
            const icon = document.getElementById('bookmarkIcon');
            if (isBookmarked) {
                icon.classList.add('text-amber-400', 'fill-amber-400');
            } else {
                icon.classList.remove('text-amber-400', 'fill-amber-400');
            }
        }

        function nextSlide() {
            if (currentSlide < slidesData.length - 1) {
                currentSlide++;
                renderSlide();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        function prevSlide() {
            if (currentSlide > 0) {
                currentSlide--;
                renderSlide();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        function goToSlide(index) {
            currentSlide = index;
            if (isDocView) {
                toggleViewMode();
            }
            renderSlide();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function toggleViewMode() {
            isDocView = !isDocView;
            const slideView = document.getElementById('slideView');
            const docView = document.getElementById('docView');
            const toggleText = document.getElementById('viewToggleText');
            const toggleIcon = document.getElementById('viewToggleIcon');
            const progressBarContainer = document.getElementById('progressBarContainer');

            if (isDocView) {
                slideView.classList.add('hidden');
                docView.classList.remove('hidden');
                toggleText.innerText = "স্লাইড মোড";
                toggleIcon.setAttribute('data-lucide', 'presentation');
                progressBarContainer.classList.add('hidden');
            } else {
                slideView.classList.remove('hidden');
                docView.classList.add('hidden');
                toggleText.innerText = "ডকুমেন্ট মোড";
                toggleIcon.setAttribute('data-lucide', 'layout');
                progressBarContainer.classList.remove('hidden');
            }
            lucide.createIcons();
        }

        function toggleTocModal() {
            const modal = document.getElementById('tocModal');
            modal.classList.toggle('hidden');
        }

        function adjustFontSize(delta) {
            fontScale = Math.max(80, Math.min(130, fontScale + delta * 5));
            document.getElementById('slideContainer').style.fontSize = `${fontScale}%`;
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    console.log(`Error attempting to enable fullscreen: ${err.message}`);
                });
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }

        window.onload = initApp;
    </script>
</body>
</html>
